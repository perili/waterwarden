// ── Forward pass math ──────────────────────────────────────────────────────
function relu(x) { return x > 0 ? x : 0; }

function softmax(arr) {
  var max = Math.max.apply(null, arr);
  var exps = arr.map(function(x) { return Math.exp(x - max); });
  var sum  = exps.reduce(function(a, b) { return a + b; }, 0);
  return exps.map(function(x) { return x / sum; });
}

function matVec(W, x) {
  var out = new Array(W[0].length).fill(0);
  for (var j = 0; j < W[0].length; j++) {
    for (var i = 0; i < x.length; i++) {
      out[j] += W[i][j] * x[i];
    }
  }
  return out;
}

function predict(r, g, b) {
  var x = [r, g, b];
  for (var li = 0; li < LAYERS.length; li++) {
    var layer = LAYERS[li];
    var y = matVec(layer.W, x);
    y = y.map(function(v, j) { return v + layer.b[j]; });
    if (layer.activation === 'relu') {
      x = y.map(relu);
    } else if (layer.activation === 'softmax') {
      x = softmax(y);
    } else {
      x = y;
    }
  }
  return x;
}

  try {
    var probs   = predict(r, g, b);
    var bestIdx  = 0;
    var bestProb = 0;
    for (var i = 0; i < probs.length; i++) {
      if (probs[i] > bestProb) {
        bestProb = probs[i];
        bestIdx  = i;
      }
    }
    sendResult(LABELS[bestIdx], bestProb.toFixed(4), bestIdx);
  } catch(e) {
    sendResult('error', '0', -1);
  }
};
